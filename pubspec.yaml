name: english_zero_to_hero
description: English Zero-to-Hero - Learn English from A0 to C1

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  http: ^1.1.0
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.3
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  avatar_glow: ^2.0.2
  animated_text_kit: ^4.2.2
  modal_bottom_sheet: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  gap: ^3.0.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
